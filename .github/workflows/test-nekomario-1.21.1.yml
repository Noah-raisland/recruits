name: Test Nekomario Recruits 1.21.1

on:
  push:
    branches:
      - test-nekomario-1.21.1-1.15.2
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload JARs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: recruits-neoforge-1.21.1-nekomario
          path: build/libs/*.jar
          if-no-files-found: error
