name: Recruits NeoForge 21.1.233
on:
  push:
    branches: ['port/recruits-1.15.2-neoforge-21.1.233']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: chmod +x gradlew
      - name: Build production JAR and regression tests
        run: ./gradlew clean build shadowJar --stacktrace
      - name: Verify server gameplay
        run: ./gradlew runGameTestServer --stacktrace
      - name: Verify packaged mod and server restart
        run: python scripts/verify_runtime.py server
      - name: Install virtual client display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libopenal1
      - name: Verify client renderers and resources
        run: python scripts/verify_runtime.py client
      - uses: actions/upload-artifact@v4
        with:
          name: recruits-1.21.1-neoforge-21.1.233
          path: build/libs/*-all.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recruits-verification-logs
          path: |
            build/test-results/
            run-gametest/logs/
            production-server/*.log
            client-smoke.log
