name: Recruits NeoForge 21.1.233
on:
  push:
    branches: ['port/recruits-1.15.2-neoforge-21.1.233']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: chmod +x gradlew
      - name: Build production JAR and regression tests
        run: ./gradlew clean build shadowJar --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: recruits-1.21.1-neoforge-21.1.233
          path: build/libs/*-all.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recruits-build-reports
          path: build/test-results/test/
