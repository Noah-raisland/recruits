name: NeoForge 1.21.1 Port Build

on:
  push:
    branches:
      - neoforge-1.21.1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew clean build --stacktrace

      - name: Upload test JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: recruits-neoforge-1.21.1
          path: build/libs/*.jar
